service: setly-backend-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29
  environment:
    STAGE: ${self:provider.stage}
    S3_BUCKET_NAME: setly-user-uploads-${self:provider.stage}
    CLOUDFRONT_DOMAIN: ${self:custom.cloudfrontDomain.${self:provider.stage}, ''}
    # MongoDB URI will be fetched from Secrets Manager at runtime
    
  iam:
    role:
      statements:
        # S3 permissions for signed URLs
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
            - s3:GetObject
            - s3:DeleteObject
          Resource: 
            - arn:aws:s3:::setly-user-uploads-${self:provider.stage}/*
        # Secrets Manager permissions
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: 
            - arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:setly/${self:provider.stage}/*
        # CloudWatch Logs
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: '*'

custom:
  cloudfrontDomain:
    dev: ''
    stage: ''
    prod: ''
  
  serverless-offline:
    httpPort: 3000
    
functions:
  api:
    handler: src/index.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors:
            origin: 
              - https://setly.in
              - https://stage.setly.in
              - https://dev.setly.in
              - http://localhost:4200
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true

resources:
  Resources:
    # S3 Bucket for user uploads
    UserUploadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: setly-user-uploads-${self:provider.stage}
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - https://setly.in
                - https://stage.setly.in
                - https://dev.setly.in
                - http://localhost:4200
              AllowedMethods:
                - GET
                - PUT
                - POST
                - DELETE
              AllowedHeaders:
                - '*'
              MaxAge: 3000
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: DeleteIncompleteMultipartUploads
              Status: Enabled
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 7
                
    # CloudFront Distribution
    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: Setly User Uploads CDN - ${self:provider.stage}
          Origins:
            - Id: S3Origin
              DomainName: !GetAtt UserUploadsBucket.RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}
          DefaultCacheBehavior:
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            Compress: true
            DefaultTTL: 86400
            MaxTTL: 31536000
            MinTTL: 0
          PriceClass: PriceClass_100
          
    CloudFrontOriginAccessIdentity:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: OAI for Setly User Uploads - ${self:provider.stage}
          
    # S3 Bucket Policy to allow CloudFront
    UserUploadsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref UserUploadsBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                CanonicalUser: !GetAtt CloudFrontOriginAccessIdentity.S3CanonicalUserId
              Action: s3:GetObject
              Resource: !Sub ${UserUploadsBucket.Arn}/*

plugins:
  - serverless-plugin-typescript
  - serverless-offline

package:
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!src/**'
    - '!*.md'
    - dist/**
