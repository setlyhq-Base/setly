[build]
  # This file is retained for local CLI deploys. CI uses the root netlify.toml.
  command = "npm run build"
  publish = "dist/setly/browser"

[build.environment]
  NODE_VERSION = "22"

# Angular SPA: serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
