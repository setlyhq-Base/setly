<app-header></app-header>
@if (!environment.firebase.apiKey) {
  <div class="bg-yellow-50 border-b border-yellow-200 text-sm text-yellow-900 px-4 py-2" data-testid="demo-banner">
    Auth in demo mode – add Firebase config to environment files for full sign-in.
  </div>
}
<main class="min-h-screen pb-24 md:pb-0" data-testid="main-wrapper">
  <router-outlet></router-outlet>
  <presence-indicator></presence-indicator>
  </main>
<div class="hidden md:block">
  <app-footer></app-footer>
</div>
@if (environment.assistant.enabled) {
  <app-assistant-widget data-testid="assistant-widget"></app-assistant-widget>
}
<app-fab></app-fab>
<!-- Global Toasts -->
<app-toast-container></app-toast-container>
