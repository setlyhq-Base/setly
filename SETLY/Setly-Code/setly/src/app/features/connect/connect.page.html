<div class="premium-connect-page" aria-label="Connect page">
  <!-- Pull-to-Refresh Indicator -->
  <div 
    class="pull-refresh-indicator" 
    [class.active]="isRefreshing()"
    [style.opacity]="isRefreshing() ? 1 : 0">
    <div class="refresh-spinner"></div>
    <span>{{ isRefreshing() ? 'Refreshing...' : 'Pull to refresh' }}</span>
  </div>

  <!-- Loading Bar -->
  <div 
    class="loading-bar" 
    [class.active]="loading()" 
    style="top: var(--header-height)">
  </div>

  <!-- Instagram-Style Sticky Top Bar -->
  <div class="instagram-top-bar">
    <button 
      (click)="openFilters()" 
      class="top-bar-action"
      aria-label="Filters">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>
    
    <h1 class="page-title">Connect</h1>
    
    <div class="top-bar-actions">
      <button 
        (click)="openMapView()" 
        class="top-bar-action"
        aria-label="Map view">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 2v16M16 6v16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      
      <button 
        (click)="openNotifications()" 
        class="top-bar-action notification-btn"
        aria-label="Notifications">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" stroke="currentColor" stroke-width="2"/>
          <path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="notification-badge" *ngIf="newAvailable()">{{ newCount() }}</span>
      </button>
    </div>
  </div>

  <!-- Instagram-Style Feed (Mobile-First, Full Width) -->
  <div 
    class="mobile-feed"
    appPullToRefresh
    (refresh)="refreshFeed()">
    <!-- Campus Highlights -->
    <app-campus-highlights></app-campus-highlights>
    
    <!-- People Near You -->
    <app-people-near-you></app-people-near-you>
    
    <!-- Trending Topics -->
    <app-trending-topics 
      (topicSelected)="onTopicSelected($event)"
      (quickFilterApplied)="onQuickFilterApplied($event)">
    </app-trending-topics>

    <!-- Mobile Tabs -->
    <nav class="mobile-tabs-nav">
      <button 
        *ngFor="let t of tabs"
        (click)="onTabClick(t)"
        class="mobile-tab"
        [class.active]="activeTab()===t">
        {{ t }}
      </button>
      
      <button 
        (click)="refreshCurrent()" 
        class="mobile-refresh-btn"
        [attr.aria-busy]="loading()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M4 12a8 8 0 118 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </nav>

    <!-- Results Count -->
    <div class="mobile-results-header">
      <span class="results-count">
        <strong>{{ filteredPosts().length }}</strong> results
      </span>
    </div>

    <!-- Feed -->
    <div class="relative">
      <button 
        *ngIf="newAvailable()" 
        (click)="showNew()" 
        class="new-posts-badge-mobile">
        {{ newCount() > 0 ? (newCount() + ' new') : 'New posts' }}
      </button>
      
      <ng-container *ngIf="activeTab() === 'People'; else mobileFeed">
        <app-people-directory></app-people-directory>
      </ng-container>
      
      <ng-template #mobileFeed>
        <app-connect-feed
          [feed]="{ posts: filteredPosts(), nextCursor: feed().nextCursor }"
          [loading]="loading()"
          (requestMore)="loadMore()"
          (postOpened)="onPostOpened($event)">
        </app-connect-feed>
      </ng-template>
    </div>
  </div>

  <!-- Filter Drawer (Mobile) -->
  <app-filter-drawer
    [isOpen]="filterDrawerOpen"
    [resultsCount]="filteredPosts().length"
    (filtersChanged)="onFilterDrawerChange($event)"
    (closed)="filterDrawerOpen.set(false)">
  </app-filter-drawer>

  <!-- Map View (Full Screen) -->
  <app-map-view
    *ngIf="mapViewOpen()"
    (close)="closeMapView()">
  </app-map-view>

  <!-- Notifications Drawer -->
  <app-notifications-drawer
    *ngIf="notificationsOpen()"
    (close)="closeNotifications()">
  </app-notifications-drawer>

  <!-- Toast Container -->
  <app-toast-container></app-toast-container>
</div>
