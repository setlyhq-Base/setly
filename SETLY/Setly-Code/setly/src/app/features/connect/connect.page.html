<div class="min-h-screen bg-white text-gray-900" aria-label="Connect page">
  <!-- Top loading bar over feed on re-query -->
  <div class="h-0.5 bg-indigo-500 fixed left-0 right-0 transition-opacity duration-300" [class.opacity-0]="!loading()" [class.opacity-100]="loading()" style="top: var(--header-height)"></div>

  <!-- Sticky in-page header for mobile quick filters -->
  <div class="sticky top-0 z-20 bg-white border-b border-gray-100 px-4 py-2 md:hidden">
    <div class="flex items-center gap-3">
      <button (click)="toggleFilters()" class="text-sm btn-brand px-3 py-1 rounded-md" aria-label="Toggle filters">Filters</button>
      <select [value]="sort()" (change)="onSortSelect($event)" aria-label="Sort posts" class="text-sm border rounded-md px-2 py-1">
        <option value="trending">Trending</option>
        <option value="new">New</option>
        <option value="near">Near you</option>
      </select>
      <button (click)="viewMode('map')" class="text-sm px-3 py-1 border rounded-md" aria-label="Map view">Map</button>
    </div>
    <!-- Horizontal filter chips -->
    <div class="mt-2 -mx-4 px-4 overflow-x-auto">
      <div class="flex items-center gap-2 pb-1" style="min-height: 32px;">
        <button *ngIf="filters().city" (click)="toggleFilters()" class="px-3 py-1 rounded-full border text-xs whitespace-nowrap">{{filters().city}}</button>
        <button *ngIf="filters().roomType" (click)="toggleFilters()" class="px-3 py-1 rounded-full border text-xs whitespace-nowrap">{{filters().roomType}} room</button>
        <button *ngIf="filters().maxPrice" (click)="toggleFilters()" class="px-3 py-1 rounded-full border text-xs whitespace-nowrap">Under {{'$'}}{{filters().maxPrice}}</button>
        <button *ngIf="filters().verifiedOnly" (click)="toggleFilters()" class="px-3 py-1 rounded-full border text-xs whitespace-nowrap">Verified only</button>
        <button *ngFor="let tag of filters().interests || []" (click)="toggleFilters()" class="px-3 py-1 rounded-full border text-xs whitespace-nowrap">{{tag}}</button>
      </div>
    </div>
  </div>

  <!-- Desktop 3 column layout with sticky rails -->
  <div class="mx-auto max-w-[1600px] px-4 py-6 hidden lg:grid gap-6" style="grid-template-columns: 280px 1fr 320px;" aria-label="Desktop 3 column layout">
    <!-- Left Rail -->
    <aside class="space-y-4 sticky self-start" style="top: calc(var(--header-height) + 24px)" aria-label="Filters panel">
      <app-connect-filters-panel (filtersChanged)="onFiltersPanelChange($event)"></app-connect-filters-panel>
    </aside>

    <!-- Center Feed -->
    <main>
      <!-- Page hero -->
      <div class="card-white p-4 mb-4 hover-lift" aria-label="Connect overview">
        <div class="flex flex-wrap items-start md:items-center justify-between gap-x-6 gap-y-3">
          <div class="leading-tight min-w-[200px]">
            <h1 class="text-xl font-semibold mb-0">Setly Connect</h1>
            <p class="text-sm text-gray-600 mt-0.5">Discover people, rooms, rides, and marketplace items around your university.</p>
          </div>
          <div class="order-last w-full h-px bg-gray-100 md:hidden"></div>
          <div class="flex items-center gap-3 shrink-0">
            <div class="hidden md:block text-xs text-gray-500 leading-none pt-0.5" aria-label="Current results count">{{ filteredPosts().length }} results</div>
            <button (click)="openCreate()" aria-label="Create new post" class="w-9 h-9 inline-flex items-center justify-center rounded-full bg-indigo-600 text-white shadow-sm hover:bg-indigo-500 active:bg-indigo-600 focus-ring transition">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button (click)="toggleFilters()" class="px-3 py-1.5 border rounded-md text-sm focus-ring">Refine</button>
          </div>
        </div>
        <!-- Quick chips -->
        <div class="mt-4 flex flex-wrap gap-2 text-xs">
          <button (click)="applyQuick({ verifiedOnly: true })" class="chip focus-ring" [class.chip-selected]="filters().verifiedOnly">Verified only</button>
          <button (click)="applyQuick({ roomType: 'private' })" class="chip focus-ring" [class.chip-selected]="filters().roomType==='private'">Private rooms</button>
          <button (click)="applyQuick({ roomType: 'shared' })" class="chip focus-ring" [class.chip-selected]="filters().roomType==='shared'">Shared rooms</button>
          <button (click)="applyQuick({ city: 'Boston' })" class="chip focus-ring" [class.chip-selected]="filters().city==='Boston'">Boston</button>
          <button (click)="applyQuick({ city: 'NYC' })" class="chip focus-ring" [class.chip-selected]="filters().city==='NYC'">NYC</button>
        </div>
      </div>

      <!-- Page-local header -->
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
          <label class="text-sm text-gray-600">Sort</label>
          <select [value]="sort()" (change)="onSortSelect($event)" class="text-sm border rounded-md px-2 py-1">
            <option value="trending">Trending</option>
            <option value="new">New</option>
            <option value="near">Near you</option>
          </select>
          <button (click)="viewMode('map')" class="text-sm px-3 py-1 border rounded-md">Map</button>
          <span *ngIf="smartActive()" class="ml-2 inline-flex items-center gap-1 text-xs px-2 py-1 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200" title="Smart suggestions active">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l1.2 3.4L16.5 8 13.2 9.2 12 12.5 10.8 9.2 7.5 8l3.3-1.6L12 3z" stroke="#5A4FF3" stroke-width="1.2"/></svg>
            Smart
            <button (click)="clearSmart()" class="ml-1 text-[10px] px-1 py-0.5 rounded hover:bg-indigo-100" aria-label="Clear smart suggestions">×</button>
          </span>
        </div>
        <div class="text-sm text-gray-600">{{ filteredPosts().length }} results</div>
      </div>

      <!-- Live new posts banner -->
      <div *ngIf="newAvailable()" class="mb-3">
        <button (click)="showNew()" class="w-full text-sm px-3 py-2 rounded-md bg-indigo-50 border border-indigo-200 text-indigo-800 focus-ring">
          {{ newCount() > 0 ? (newCount() + ' new posts available — tap to refresh') : 'New posts available — tap to refresh' }}
        </button>
      </div>

      <!-- Tabs (sticky sub-header) -->
      <nav class="sticky -top-4 z-10 bg-white/90 backdrop-blur flex items-center gap-2 mb-4 relative px-1 py-2 border border-gray-100 shadow-sm rounded-md" aria-label="Content type tabs" role="tablist" (keydown)="onTabsKeydown($event)">
        <button *ngFor="let t of tabs; let i = index"
                (click)="onTabClick(t)"
                [class.btn-brand]="activeTab()===t"
                class="px-3 py-1.5 rounded-md text-sm border focus-ring"
                role="tab"
                [attr.aria-selected]="activeTab()===t">
          {{ t }}
        </button>
        <span class="ml-auto"></span>
        <button (click)="refreshCurrent()" class="px-3 py-1.5 rounded-md text-sm border focus-ring inline-flex items-center gap-2" [attr.aria-busy]="loading()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12a8 8 0 118 8" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round"/></svg>
          Refresh
        </button>
      </nav>

      <!-- Feed -->
      <app-connect-feed
        [feed]="{ posts: filteredPosts(), nextCursor: feed().nextCursor }"
        [loading]="loading()"
        (requestMore)="loadMore()"
        (postOpened)="onPostOpened($event)">
      </app-connect-feed>
    </main>

    <!-- Right Rail -->
    <aside class="space-y-4 sticky self-start" style="top: calc(var(--header-height) + 24px)" aria-label="Right rail">
      <app-connect-right-rail (createRequested)="openCreate()"></app-connect-right-rail>
    </aside>
  </div>

  <!-- Mobile feed -->
  <div class="px-4 py-4 lg:hidden">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-3">
        <label class="text-sm text-gray-600">Sort</label>
        <select [value]="sort()" (change)="onSortSelect($event)" class="text-sm border rounded-md px-2 py-1">
          <option value="trending">Trending</option>
          <option value="new">New</option>
          <option value="near">Near you</option>
        </select>
      </div>
      <div class="text-sm text-gray-600">{{ filteredPosts().length }} results</div>
    </div>

    <div *ngIf="newAvailable()" class="mb-3">
      <button (click)="showNew()" class="w-full text-sm px-3 py-2 rounded-md bg-indigo-50 border border-indigo-200 text-indigo-800 focus-ring">
        {{ newCount() > 0 ? (newCount() + ' new posts available — tap to refresh') : 'New posts available — tap to refresh' }}
      </button>
    </div>

    <nav class="sticky -top-4 z-10 bg-white/90 backdrop-blur flex items-center gap-2 mb-4 relative px-1 py-2 border border-gray-100 shadow-sm rounded-md" aria-label="Content type tabs" role="tablist" (keydown)="onTabsKeydown($event)">
      <button *ngFor="let t of tabs"
              (click)="onTabClick(t)"
              [class.btn-brand]="activeTab()===t"
              class="px-3 py-1.5 rounded-md text-sm border focus-ring"
              role="tab"
              [attr.aria-selected]="activeTab()===t">
        {{ t }}
      </button>
      <span class="ml-auto"></span>
      <button (click)="refreshCurrent()" class="px-3 py-1.5 rounded-md text-sm border focus-ring inline-flex items-center gap-2" [attr.aria-busy]="loading()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12a8 8 0 118 8" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round"/></svg>
        Refresh
      </button>
    </nav>

    <app-connect-feed
      [feed]="{ posts: filteredPosts(), nextCursor: feed().nextCursor }"
      [loading]="loading()"
      (requestMore)="loadMore()"
      (postOpened)="onPostOpened($event)">
    </app-connect-feed>

    <div *ngIf="showMobileFilters()" class="mt-4">
      <app-connect-filters-panel (filtersChanged)="onFiltersPanelChange($event)"></app-connect-filters-panel>
    </div>
  </div>

  <app-toast-container></app-toast-container>
</div>
