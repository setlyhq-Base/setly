<div class="premium-connect-page" aria-label="Connect page">
  <!-- Pull-to-Refresh Indicator -->
  <div 
    class="pull-refresh-indicator" 
    [class.active]="isRefreshing()"
    [style.opacity]="isRefreshing() ? 1 : 0">
    <div class="refresh-spinner"></div>
    <span>{{ isRefreshing() ? 'Refreshing...' : 'Pull to refresh' }}</span>
  </div>

  <!-- Loading Bar -->
  <div 
    class="loading-bar" 
    [class.active]="loading()" 
    style="top: var(--header-height)">
  </div>

  <!-- Instagram-Style Sticky Top Bar -->
  <div class="instagram-top-bar">
    <div class="top-bar-left">
      <button 
        (click)="openFilters()" 
        class="top-bar-action"
        aria-label="Filters">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
      
      <button 
        (click)="openMapView()" 
        class="top-bar-action"
        aria-label="Map view">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 2v16M16 6v16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    
    <div class="header-logo-wrapper">
      <span class="setly-logo-text">
        <span class="logo-dots">
          <span class="logo-dot logo-dot-1"></span>
          <span class="logo-dot logo-dot-2"></span>
        </span>
        <span class="logo-wordmark">SETLY</span>
      </span>
    </div>
    
    <div class="top-bar-actions">
      <button 
        (click)="searchOpen.set(true)" 
        class="top-bar-action"
        aria-label="Search">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
          <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      
      <button 
        (click)="openNotifications()" 
        class="top-bar-action notification-btn"
        aria-label="Notifications">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="notification-badge" *ngIf="newAvailable()">{{ newCount() }}</span>
      </button>
      
      <button 
        [routerLink]="['/messages']"
        class="top-bar-action"
        aria-label="Messages">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Instagram-Style Feed (Mobile-First, Full Width) -->
  <div 
    class="mobile-feed"
    appPullToRefresh
    (refresh)="refreshFeed()">
    <!-- Campus Highlights -->
    <app-campus-highlights></app-campus-highlights>
    
    <!-- People Near You -->
    <app-people-near-you></app-people-near-you>
    
    <!-- Trending Topics -->
    <app-trending-topics 
      (topicSelected)="onTopicSelected($event)"
      (quickFilterApplied)="onQuickFilterApplied($event)">
    </app-trending-topics>

    <!-- Mobile Tabs (Sticky with Swipe Support) -->
    <nav class="mobile-tabs-nav" 
         #tabsNav
         [class.scrolled]="isScrolled()"
         (touchstart)="onTouchStart($event)"
         (touchmove)="onTouchMove($event)"
         (touchend)="onTouchEnd($event)">
      <button 
        *ngFor="let t of tabs"
        (click)="onTabClick(t)"
        class="mobile-tab"
        [class.active]="activeTab()===t">
        {{ t }}
      </button>
      
      <button 
        (click)="refreshCurrent()" 
        class="mobile-refresh-btn"
        [attr.aria-busy]="loading()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M4 12a8 8 0 118 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </nav>

    <!-- Results Count -->
    <div class="mobile-results-header">
      <span class="results-count">
        <strong>{{ filteredPosts().length }}</strong> results
      </span>
    </div>

    <!-- Feed -->
    <div class="relative">
      <button 
        *ngIf="newAvailable()" 
        (click)="showNew()" 
        class="new-posts-badge-mobile">
        {{ newCount() > 0 ? (newCount() + ' new') : 'New posts' }}
      </button>
      
      <ng-container *ngIf="activeTab() === 'People'; else mobileFeed">
        <app-people-directory></app-people-directory>
      </ng-container>
      
      <ng-template #mobileFeed>
        <app-connect-feed
          [feed]="{ posts: filteredPosts(), nextCursor: feed().nextCursor }"
          [loading]="loading()"
          (requestMore)="loadMore()"
          (postOpened)="onPostOpened($event)">
        </app-connect-feed>
      </ng-template>
    </div>
  </div>

  <!-- Filter Drawer (Mobile) -->
  <app-filter-drawer
    [isOpen]="filterDrawerOpen"
    [resultsCount]="filteredPosts().length"
    (filtersChanged)="onFilterDrawerChange($event)"
    (closed)="filterDrawerOpen.set(false)">
  </app-filter-drawer>

  <!-- Map View (Full Screen) -->
  <app-map-view
    *ngIf="mapViewOpen()"
    (close)="closeMapView()">
  </app-map-view>

  <!-- Notifications Drawer -->
  <app-notifications-drawer
    *ngIf="notificationsOpen()"
    (close)="closeNotifications()">
  </app-notifications-drawer>

  <!-- Global Search Overlay -->
  <app-global-search-overlay
    *ngIf="searchOpen()"
    (close)="searchOpen.set(false)">
  </app-global-search-overlay>

  <!-- Toast Container -->
  <app-toast-container></app-toast-container>
</div>
