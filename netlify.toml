[build]
  base = "SETLY/Setly-Code/setly"
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = "dist/setly/browser"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Angular SPA: serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
